;; ============================================================================
;; ALMA self-hosted SIP — INBOUND dialplan (Phase 2, PROVEN LIVE 2026-07-25)
;; Append to /etc/asterisk/extensions.conf on the VPS.
;;
;; THE WIN: a call arriving on our own Asterisk carries the real caller number in the
;; SIP From header, so `CALLERID(num)` is the actual number (+8801779640373 live-proven).
;; NGS stripped it and would not expose their template variable, which is why the boss
;; calling his own line always got the receptionist instead of "জি বস".
;;
;; Flow: trunk INVITE -> endpoint `alma` (context=from-alma, see alma-trunk.conf)
;;       -> from-alma remembers the DIALED number (ALMA_DID) -> alma-in
;;       -> Stasis(alma-sip,inbound,<caller>,<did>) hands the channel to the Node
;;          gateway (sip-gateway-service.mjs), which asks our Next.js sip-inbound
;;          route who is calling, answers, and bridges the Gemini Live bot.
;;
;; ALMA_DID is set BEFORE the Goto because the shared `alma-in` handler runs with
;; EXTEN='s' — without it every DID would look identical and the multi-DID persona
;; map (boss line vs staff/support line) could never distinguish them.
;;
;; INBOUND REQUIRES REGISTRATION (see [alma-reg] in alma-trunk.conf): the trunk only
;; sends INVITEs to a registered binding, and the account is single-binding — so NGS
;; must be OFF for our registration to win. That makes inbound a CLEAN CUTOVER.
;; ============================================================================

[from-alma]
exten => _[0-9*#!].,1,Set(ALMA_DID=${EXTEN})
 same => n,Goto(alma-in,s,1)
exten => s,1,Set(ALMA_DID=${EXTEN})
 same => n,Goto(alma-in,s,1)

[alma-in]
exten => s,1,NoOp(=== ALMA INBOUND caller=[${CALLERID(num)}] name=[${CALLERID(name)}] did=[${ALMA_DID}] ===)
 same => n,Stasis(alma-sip,inbound,${CALLERID(num)},${ALMA_DID})
 same => n,Hangup()

;; Multi-DID (owner ask): no dialplan change is needed for a second line — the DID
;; travels to the gateway and the persona/forward target is chosen in
;; src/app/api/assistant/voice-call/sip-inbound/route.ts via SIP_DID_MAP, e.g.
;;   SIP_DID_MAP={"09649777738":{"line":"boss"},"0XXXXXXXXXX":{"line":"support","forward":"01XXXXXXXXX"}}
;; A second DID from the provider is the only external dependency.
