;; ============================================================================
;; ALMA module loader rules — /etc/asterisk/modules.conf
;;
;; These two lines MUST sit inside the [modules] section, directly under
;; `autoload=yes`. Asterisk reads load/noload directives ONLY from [modules];
;; the same lines appended at the end of the file land in [global], where they
;; are silently ignored — that is exactly what happened on 2026-07-25, and the
;; browser softphone broke the moment an unattended apt upgrade restarted
;; Asterisk (06:26) and chan_sip came back.
;;
;; WHY chan_sip must never load: it registers the "sip" websocket subprotocol
;; before res_pjsip_transport_websocket can. Every staff REGISTER is then
;; validated against chan_sip's EMPTY user list, so a CORRECT password is
;; answered "Wrong password", and res_pjsip_transport_websocket stays loaded
;; but "Not Running". Nothing else breaks — the trunk stays registered and
;; inbound AI calls keep working — so the failure is completely silent.
;; chan_sip also grabs UDP 5060, which is what internet port scanners reach.
;;
;; The gateway's softphone watchdog (checkSoftphoneStack in
;; worker/src/voice-relay/sip-gateway-service.mjs) verifies this at runtime and
;; repairs it when the line is idle, but the config is the primary fix.
;;
;; Verify after any Asterisk restart:
;;   asterisk -rx "module show like chan_sip"                  -> 0 modules loaded
;;   asterisk -rx "module show like res_pjsip_transport_websocket" -> Running
;; ============================================================================

[modules]
autoload=yes

noload => chan_sip.so
load => res_pjsip_transport_websocket.so
