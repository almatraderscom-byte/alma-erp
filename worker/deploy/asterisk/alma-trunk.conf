;; ============================================================================
;; ALMA self-hosted SIP trunk — pjsip.conf block (PROVEN WORKING 2026-07-25)
;; Append to /etc/asterisk/pjsip.conf on the VPS. Outbound proven: a real call
;; to the owner rang, answered (channel Up), and played audio.
;;
;; ROOT CAUSE (diagnosed, not guessed): the trunk 103.170.231.10 does NOT respond
;; to SIP requests sourced from port 5060 (tcpdump: 0 reply packets). It DOES
;; respond to non-5060 source ports (raw-Node ephemeral probe → 200 OK). FIX =
;; a DEDICATED transport bound to 5062 so this trunk sources from 5062, not 5060.
;; (Asterisk's default transport-udp:5060 stays for anything else.)
;;
;; NOTE: password is a secret — set the real value on the VPS only, never in git.
;; ============================================================================

[transport-alma]
type=transport
protocol=udp
bind=0.0.0.0:5062

[alma-auth]
type=auth
auth_type=userpass
username=09649777738
password=REDACTED_SET_ON_VPS

[alma-aor]
type=aor
contact=sip:103.170.231.10:5060
qualify_frequency=0          ; trunk ignores OPTIONS; treat contact as always-up
                             ; (qualify=30 marked it Unavailable → origination refused)

[alma]
type=endpoint
transport=transport-alma     ; <-- the fix: source from 5062, not 5060
context=from-alma
disallow=all
allow=ulaw,alaw
outbound_auth=alma-auth
aors=alma-aor
from_user=09649777738
from_domain=103.170.231.10
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[alma-identify]
type=identify
endpoint=alma
match=103.170.231.10

;; ---------------------------------------------------------------------------
;; INBOUND registration (Phase 2, PROVEN LIVE 2026-07-25). The trunk only sends
;; INVITEs to a registered binding, and the account is SINGLE-binding — NGS
;; re-registers every ~60s and wins — so inbound is a CLEAN CUTOVER: NGS must be
;; off (owner disables the trunk / sets its port wrong) for this to hold.
;; With this registered, a real call to the DID reached our Asterisk and the
;; INVITE From carried +8801779640373 — the caller-ID NGS strips.
;; pjsip handles the semux.io qop=auth digest automatically.
[alma-reg]
type=registration
transport=transport-alma       ; must source from 5062 like everything else on this trunk
outbound_auth=alma-auth
server_uri=sip:103.170.231.10:5060
client_uri=sip:09649777738@103.170.231.10
contact_user=09649777738
retry_interval=60
;; 3600, NOT the 300 we started with — this single number was ~45% of all outbound calls.
;;
;; MEASURED 2026-07-25, 20 identical test calls to unassigned numbers, capture on every one:
;;   0-80 s after a (re-)registration   -> 8 of 8 calls DIED
;;   100+ s after a (re-)registration   -> 12 of 12 calls reached 183 Session Progress
;; The provider's switch needs about 100 seconds after each REGISTER before it will route
;; our outbound calls. Inside that window their edge still answers 100 Trying and then
;; swallows the INVITE; a CANCEL comes back 481 Call/Transaction Does Not Exist, i.e. the
;; call was never created on their core — which is exactly why these calls appear in NO CDR
;; and the callee's phone never rings.
;;
;; At expiration=300 we re-registered every 5 minutes, so roughly 100 s in every 300 was a
;; dead window: about 1 call in 2 lost, matching the owner's own count (18 of 35 failed).
;; At 3600 the same dead window happens once an hour instead: ~2.8%. The provider grants
;; 3600 (verified in their 200 OK), so nothing here is wishful.
;;
;; Do NOT reload res_pjsip_outbound_registration during business hours without knowing this:
;; the reload re-registers, and that starts a fresh ~100 s hole in outbound calling.
expiration=3600
line=yes
endpoint=alma

