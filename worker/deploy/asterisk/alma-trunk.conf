;; ============================================================================
;; ALMA self-hosted SIP trunk — pjsip.conf block (PROVEN WORKING 2026-07-25)
;; Append to /etc/asterisk/pjsip.conf on the VPS. Outbound proven: a real call
;; to the owner rang, answered (channel Up), and played audio.
;;
;; ROOT CAUSE (diagnosed, not guessed): the trunk 103.170.231.10 does NOT respond
;; to SIP requests sourced from port 5060 (tcpdump: 0 reply packets). It DOES
;; respond to non-5060 source ports (raw-Node ephemeral probe → 200 OK). FIX =
;; a DEDICATED transport bound to 5062 so this trunk sources from 5062, not 5060.
;; (Asterisk's default transport-udp:5060 stays for anything else.)
;;
;; NOTE: password is a secret — set the real value on the VPS only, never in git.
;; ============================================================================

[transport-alma]
type=transport
protocol=udp
bind=0.0.0.0:5062

[alma-auth]
type=auth
auth_type=userpass
username=09649777738
password=REDACTED_SET_ON_VPS

[alma-aor]
type=aor
contact=sip:103.170.231.10:5060
qualify_frequency=0          ; trunk ignores OPTIONS; treat contact as always-up
                             ; (qualify=30 marked it Unavailable → origination refused)

[alma]
type=endpoint
transport=transport-alma     ; <-- the fix: source from 5062, not 5060
context=from-alma
disallow=all
allow=ulaw,alaw
outbound_auth=alma-auth
aors=alma-aor
from_user=09649777738
from_domain=103.170.231.10
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[alma-identify]
type=identify
endpoint=alma
match=103.170.231.10

;; ---------------------------------------------------------------------------
;; INBOUND registration (Phase 2, PROVEN LIVE 2026-07-25). The trunk only sends
;; INVITEs to a registered binding, and the account is SINGLE-binding — NGS
;; re-registers every ~60s and wins — so inbound is a CLEAN CUTOVER: NGS must be
;; off (owner disables the trunk / sets its port wrong) for this to hold.
;; With this registered, a real call to the DID reached our Asterisk and the
;; INVITE From carried +8801779640373 — the caller-ID NGS strips.
;; pjsip handles the semux.io qop=auth digest automatically.
[alma-reg]
type=registration
transport=transport-alma       ; must source from 5062 like everything else on this trunk
outbound_auth=alma-auth
server_uri=sip:103.170.231.10:5060
client_uri=sip:09649777738@103.170.231.10
contact_user=09649777738
retry_interval=60
;; 60 SECONDS, AND THIS IS THE WHOLE BALL GAME. Read before you "clean this up".
;;
;; The provider keeps exactly ONE registration binding per SIP account, and the last
;; registrant owns it. Their panel (amarip.net → SIP Users, and /api/sip-registrations behind
;; it) shows that one row: IP, user agent, seconds left. Watch it and everything explains
;; itself:
;;
;;   09:22:51  163.227.239.96  NextGenSwitch   exp=15    <- NGS owned the line
;;   09:23:21  31.97.237.40    Asterisk PBX    exp=45    <- we took it, 60s cadence
;;
;; NGS re-registers every ~60 s, so it holds that row permanently. We were re-registering
;; every 300 s (and, for one wrong hour on 2026-07-25, every 3600 s), so for most of every
;; cycle the row belonged to somebody else — or to nobody. Outbound INVITEs sent while we did
;; not own the binding are the calls that died: no_route, rate_plan_no_match, stale_timeout,
;; or plain silence, roughly half of them, which is exactly the failure rate the owner
;; reported (18 of 35).
;;
;; A 200 OK to our REGISTER proves NOTHING. Asterisk said "Registered, 3227s left" while the
;; provider's own table did not list us at all. Never again take our side's registration
;; state as evidence — check THEIR table.
;;
;; Corollary: never let a second PBX register this account. NGS must be genuinely off (trunk
;; deactivated), not merely pointed at a wrong port, or it takes the line back every minute.
;;
;; Also true, and it bit during this investigation: reloading res_pjsip_outbound_registration
;; re-registers, and `pjsip send register <name>` sends Expires: 0 FIRST — it de-registers,
;; then registers.
expiration=60
line=yes
endpoint=alma

