;; ============================================================================
;; ALMA hold audio — append to /etc/asterisk/musiconhold.conf
;;
;; What the caller hears while the AI hunts for a human (transfer / ring group).
;; Without this they get Asterisk's stock instrumental tracks, which sound like
;; somebody else's company.
;;
;; The owner records the message; convert it to the format the telephony path
;; already runs at, so nothing is resampled at playout:
;;
;;   ffmpeg -y -i hold.mp3 -ac 1 -ar 8000 -acodec pcm_s16le \
;;       /var/lib/asterisk/moh-alma/alma-hold.wav
;;   ffmpeg -y -i hold.mp3 -ac 1 -ar 8000 -f s16le -acodec pcm_s16le \
;;       /var/lib/asterisk/moh-alma/alma-hold.sln
;;   chown asterisk:asterisk /var/lib/asterisk/moh-alma/alma-hold.*
;;
;; Both extensions, one basename: Asterisk picks the best match for the channel
;; and treats them as ONE file, so the loop does not play it twice. Check the
;; level after converting (`sox file.wav -n stat`) — around 0.14 RMS with peaks
;; near 0.5 sits comfortably against the AI's voice; the owner's first recording
;; measured exactly that.
;;
;; TRAP, paid for on 2026-07-25: `moh reload` and `module reload
;; res_musiconhold.so` BOTH report success and BOTH leave a newly added class
;; missing from `moh show classes`. Only a full unload+load picks it up:
;;
;;   asterisk -rx "module unload res_musiconhold.so"
;;   asterisk -rx "module load res_musiconhold.so"
;;   asterisk -rx "moh show classes"   # alma-hold must appear
;;   asterisk -rx "moh show files"     # and its file under it
;;
;; Do that when the line is idle — unloading MOH mid-call cuts the music.
;;
;; Finally point the gateway at it (VPS worker .env) and restart it:
;;   SIP_MOH_CLASS=alma-hold
;; Empty/unset = Asterisk's default class, i.e. the stock music.
;; ============================================================================

[alma-hold]
mode=files
directory=/var/lib/asterisk/moh-alma
sort=random
