;; ============================================================================
;; ALMA browser softphone — Asterisk WebRTC (Part 2)
;; Append to /etc/asterisk/pjsip.conf on the VPS.
;;
;; WHY: with a self-hosted PBX, staff can take real customer calls INSIDE the ERP —
;; no SIM, no handset, no per-seat fee. It also gives us the seam for screen-pop
;; (the ERP knows which call it is answering) and free staff-to-staff calls.
;;
;; TLS: the browser needs wss://, but Asterisk's own TLS would need a second
;; certificate. The VPS already runs Traefik with Let's Encrypt, so TLS terminates
;; there and reaches Asterisk's plain ws on 127.0.0.1:8088. The Traefik route is
;; PATH-RESTRICTED to /ws on purpose — Asterisk's HTTP server also serves /ari, and
;; exposing that would hand the internet full call control.
;;
;; Codecs: ulaw/alaw only, deliberately. Browsers speak PCMU/PCMA natively and the
;; PSTN leg is ulaw, so the whole path stays transcode-free; allowing opus would drag
;; in a transcoding dependency for no gain on a telephony call.
;; ============================================================================

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0
;; No port here: ws rides Asterisk's built-in HTTP server (http.conf, 127.0.0.1:8088).

;; ---------------------------------------------------------------------------
;; Staff endpoint template. One [NNNN] + [NNNN-auth] + [NNNN-aor] block per staff
;; member; passwords are generated per staff and stored server-side so the ERP can
;; hand them to an authenticated browser session (never checked into git).
;;
;; webrtc=yes is the important line: it turns on ICE, AVPF, DTLS-SRTP and rtcp-mux
;; in one go, which is exactly what a browser requires and what a desk phone does not.
;; ---------------------------------------------------------------------------

;[1001]
;type=endpoint
;transport=transport-ws
;context=from-staff
;disallow=all
;allow=ulaw,alaw
;auth=1001-auth
;aors=1001-aor
;webrtc=yes
;dtls_auto_generate_cert=yes
;direct_media=no
;callerid=Staff <1001>
;
;[1001-auth]
;type=auth
;auth_type=userpass
;username=1001
;password=SET_ON_VPS_ONLY
;
;[1001-aor]
;type=aor
;max_contacts=2          ; the same person may have the ERP open in two tabs
;remove_existing=yes
;qualify_frequency=30
