;; ============================================================================
;; ALMA self-hosted SIP gateway — Asterisk-side setup (Phase 1, PROVEN LIVE 2026-07-25)
;;
;; This documents the exact Asterisk config the sip-gateway-service.mjs needs, on
;; top of the already-proven trunk in alma-trunk.conf. Applied + verified on the VPS
;; (31.97.237.40, Asterisk 20.6.0): a real outbound call to the owner rang, answered,
;; two-way Bangla AI audio flowed, and a control-API DELETE hung it up cleanly.
;;
;; The gateway uses ARI (REST + events WS) to originate + bridge, and an externalMedia
;; AudioSocket channel (encapsulation=audiosocket, transport=tcp, Asterisk = client) to
;; carry audio to the Node gateway, which transcodes slin8k<->μ-law and bridges to the
;; unchanged Gemini Live bot. NO dialplan extension is needed for OUTBOUND: ARI
;; originates the trunk leg directly INTO the Stasis app (app=alma-sip), and the
;; externalMedia channel joins the same app. (Inbound / from-alma dialplan = Phase 2.)
;;
;; Secrets: the ARI password is generated on the VPS and lives ONLY in ari.conf +
;; the worker .env (ARI_PASS) — never in git. Values below are placeholders.
;; ============================================================================

;; ---- /etc/asterisk/http.conf --------------------------------------------------
;; ARI needs the built-in HTTP server ON, bound to localhost (the gateway is local).
;; [general]
;; enabled=yes
;; bindaddr=127.0.0.1
;; bindport=8088

;; ---- /etc/asterisk/ari.conf ---------------------------------------------------
;; [general]
;; enabled = yes
;;
;; [alma]
;; type = user
;; read_only = no
;; password = <SET_ON_VPS_ONLY>        ; openssl rand -hex 16, mirror into worker .env ARI_PASS

;; ---- Reload (no calls dropped) ------------------------------------------------
;;   asterisk -rx "core reload"
;;   asterisk -rx "http show status"   ; expect: Server Enabled and Bound to 127.0.0.1:8088
;;   curl -u alma:<pass> http://127.0.0.1:8088/ari/asterisk/info   ; auth sanity

;; ---- Firewall / security ------------------------------------------------------
;;  - ARI + AudioSocket are 127.0.0.1-only (gateway + Asterisk share the VPS).
;;  - The gateway CONTROL API (:8770) is what Vercel (voice-call.ts) POSTs to; it is
;;    key-protected (SIP_GATEWAY_KEY/SECRET) AND requires a valid per-call HMAC token,
;;    same 2-secret model as NGS. HARDENING (Phase 3): put :8770 behind the domain with
;;    TLS + IP allowlist, or firewall it, once SIP is the primary path.
;;  - Keep firewalling SIP 5060/5062 to the trunk IP (103.170.231.10) — scanners hammer
;;    the open ports (see alma-trunk.conf).
