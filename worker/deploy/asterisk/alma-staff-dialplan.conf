;; ============================================================================
;; ALMA browser softphone — what a logged-in staff member may dial.
;; Append to /etc/asterisk/extensions.conf on the VPS.
;;
;; Deliberately narrow: this dialplan IS the guard for browser-originated calls (the
;; gateway's destination allowlist only covers calls placed through its control API), so a
;; stolen browser credential must not be able to reach a premium or international number.
;; ============================================================================

[from-staff]
;; Staff-to-staff, free and internal (extensions 1000-1999).
exten => _1XXX,1,NoOp(=== STAFF INTERNAL ${CALLERID(num)} -> ${EXTEN} ===)
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

;; BD mobiles are ELEVEN digits (01 + 9). The first version of this pattern had nine X's
;; and so matched nothing a staff member would ever dial — the owner's very first browser
;; call was rejected with "extension not found in context 'from-staff'" (2026-07-25).
exten => _01XXXXXXXXX,1,NoOp(=== STAFF OUTBOUND ${CALLERID(num)} -> ${EXTEN} ===)
 same => n,Set(CALLERID(num)=09649777738)
 same => n,Dial(PJSIP/${EXTEN}@alma,45)
 same => n,Hangup()

;; BD landlines: 0 + area code 2-9 + subscriber. The [2-9] class is what keeps this from
;; matching a 00-prefixed international number, which is the whole toll-fraud risk here.
exten => _0[2-9]X.,1,NoOp(=== STAFF OUTBOUND(landline) ${CALLERID(num)} -> ${EXTEN} ===)
 same => n,Set(CALLERID(num)=09649777738)
 same => n,Dial(PJSIP/${EXTEN}@alma,45)
 same => n,Hangup()
