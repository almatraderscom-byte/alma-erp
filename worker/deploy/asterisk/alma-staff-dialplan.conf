;; ============================================================================
;; ALMA browser softphone — what a logged-in staff member may dial.
;;
;; ⚠ THIS FILE IS NOW A MIGRATION NOTE, NOT THE LIVE CONFIG.
;;
;; From the phone console's step 3 the staff dialplan is GENERATED by the gateway
;; (`renderStaffDialplan()` in worker/src/voice-relay/sip-gateway-service.mjs) into
;;   /etc/asterisk/extensions-alma-staff.conf
;; because per-extension policy — who may dial out, who is on do-not-disturb, whose
;; browser rolls over to their mobile — is set from a screen and has to end up in the
;; dialplan. The roadmap's rule is that ONE writer owns Asterisk config: it validates,
;; backs up, writes, reloads, VERIFIES with `dialplan show`, and restores the previous
;; file if the contexts do not come back.
;;
;; ── ONE-TIME STEP ON THE VPS (do this with the worker deploy) ───────────────
;;
;;   1. Edit /etc/asterisk/extensions.conf and DELETE the whole hand-written
;;      [from-staff] context (the three exten lines below, as they exist today).
;;   2. Add this line to /etc/asterisk/extensions.conf, at the top level:
;;
;;        #include "extensions-alma-staff.conf"
;;
;;   3. Restart / deploy the worker. The gateway writes the file on the next
;;      extension change; to force it immediately, change any extension's policy
;;      from the console once.
;;   4. Prove it:
;;        asterisk -rx "dialplan show from-staff"
;;        asterisk -rx "dialplan show from-staff-mobile"
;;        asterisk -rx "dialplan show from-staff-internal"
;;      All three must exist. Then place ONE staff call to confirm outbound still works.
;;
;; Leaving BOTH the old block and the include in place is the one genuinely bad
;; outcome: the last definition wins and which one that is depends on include order,
;; so the console would appear to change nothing. Delete the old block.
;;
;; ── WHY THE PATTERNS ARE WHAT THEY ARE (unchanged, and load-bearing) ────────
;;
;; This dialplan IS the guard for browser-originated calls — the gateway's own
;; destination allowlist only covers calls placed through its control API — so a
;; stolen browser credential must not be able to reach a premium or international
;; number.
;;
;;  * BD mobiles are ELEVEN digits (_01XXXXXXXXX). The first version of this pattern
;;    had nine X's and matched nothing anyone would ever dial: the owner's very first
;;    browser call was rejected with "extension not found in context 'from-staff'"
;;    (2026-07-25).
;;  * _0[2-9]X. for landlines. The [2-9] class is what keeps this from matching a
;;    00-prefixed international number, which is the whole toll-fraud risk here.
;;  * CALLERID(num) is set to our own DID. Setting it to anything the provider does
;;    not recognise changes the failure mode from a working call to an immediate
;;    reject — proven live with NGS's internal id `2323`, which is valid in their
;;    panel and not on the wire.
;;
;; The generated file keeps all three, and adds two narrower copies of the context
;; (`-mobile`, `-internal`) that the console assigns per extension.
;;
;; ── THE PREVIOUS CONTENTS, for reference and rollback ───────────────────────
;; If you ever need to go back: remove the #include, paste this block into
;; extensions.conf, and `asterisk -rx "dialplan reload"`.
;;
;; [from-staff]
;; exten => _1XXX,1,NoOp(=== STAFF INTERNAL ${CALLERID(num)} -> ${EXTEN} ===)
;;  same => n,Dial(PJSIP/${EXTEN},30)
;;  same => n,Hangup()
;;
;; exten => _01XXXXXXXXX,1,NoOp(=== STAFF OUTBOUND ${CALLERID(num)} -> ${EXTEN} ===)
;;  same => n,Set(CALLERID(num)=09649777738)
;;  same => n,Dial(PJSIP/${EXTEN}@alma,45)
;;  same => n,Hangup()
;;
;; exten => _0[2-9]X.,1,NoOp(=== STAFF OUTBOUND(landline) ${CALLERID(num)} -> ${EXTEN} ===)
;;  same => n,Set(CALLERID(num)=09649777738)
;;  same => n,Dial(PJSIP/${EXTEN}@alma,45)
;;  same => n,Hangup()
;; ============================================================================
