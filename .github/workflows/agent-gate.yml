# Phase 7 — permanent agent PR gate (roadmap release discipline).
# Every PR touching the agent surface must pass typecheck + the full agent
# suite (capability-manifest coverage, router goldens, workflow transition
# tests, guard/authorization matrices, prompt conflict linter + token budgets)
# BEFORE merge — a Vercel build alone proves compilation, not behavior.
name: Agent PR Gate

on:
  pull_request:
    paths:
      - 'src/agent/**'
      - 'src/app/api/assistant/**'
      - 'src/lib/agent-api/**'
      - 'src/lib/content-engine/**'
      - 'src/lib/creative-studio/**'
      - 'worker/src/**'
      - 'prisma/**'
      - 'scripts/migrate-on-deploy.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/agent-gate.yml'
      # Certification inputs — proof artifacts and gate scripts are evidence;
      # any change to them must re-run the SPEC-200 certification.
      - 'artifacts/**'
      - 'scripts/architecture/**'
      - 'docs/architecture/**'

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Install (postinstall runs prisma generate)
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Agent test suite (behavior gates)
        run: npm run test:agent
      - name: Image action, pipeline and durable-worker gates
        run: |
          npx vitest run \
            src/agent/lib/__tests__/image-action-contract.test.ts \
            src/agent/protocol/__tests__/agent-event-image-card.test.ts \
            src/app/api/assistant/actions/__tests__/route.test.ts \
            'src/app/api/assistant/actions/[id]/approve/__tests__/image-approval-claim.test.ts' \
            'src/app/api/assistant/actions/[id]/retry/__tests__/route.test.ts' \
            src/app/api/assistant/conversations/__tests__/route-contract.test.ts \
            src/app/api/assistant/internal/__tests__/job-result-image-replay.test.ts \
            src/app/api/assistant/internal/__tests__/pending-jobs-dispatch.test.ts \
            src/app/api/assistant/internal/__tests__/pending-jobs-preview-scope.test.ts \
            src/lib/content-engine/__tests__/pipeline-render-idempotency.test.ts
          node --test \
            worker/src/__tests__/image-*.test.mjs \
            worker/src/__tests__/preview-image-e2e.test.mjs
      # SPEC-200 — the official architecture certification is release-blocking:
      # freeze-baseline steps (contracts, forbidden-imports, ownership, ADR,
      # proof-complete for SPEC-001..200) + admission/gateway/authorization
      # bypass gates. Certification derives ONLY from executable proof; a FAIL
      # here means the architecture claim is not truthful — fix the evidence,
      # never bypass the gate.
      - name: Architecture certification (SPEC-200)
        run: node scripts/architecture/certify-architecture.mjs
