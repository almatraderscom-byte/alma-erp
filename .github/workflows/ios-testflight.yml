# TestFlight upload — MANUAL ONLY. This workflow never runs on push, so
# simulator testing / normal commits can never accidentally burn a TestFlight
# build. To ship: GitHub → Actions → "iOS TestFlight Upload" → Run workflow.
#
# Signing: Xcode cloud signing via an App Store Connect API key
# (-allowProvisioningUpdates). No certificate export needed on the Mac.
# Build numbers: GIT is the source of truth. manageAppVersionAndBuildNumber is
# OFF so the upload carries exactly the committed CURRENT_PROJECT_VERSION —
# the repo rule is "build number in git must always equal the number on
# TestFlight" (that traceability is what the builds 63–69 feature losses cost
# us). Bump + commit + push BEFORE running this workflow; a number already used
# on App Store Connect will be rejected, which is the desired loud failure.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID      — App Store Connect API key ID (e.g. ABC123XYZ)
#   ASC_ISSUER_ID   — issuer ID (UUID from the API Keys page)
#   ASC_PRIVATE_KEY — full contents of the downloaded AuthKey_XXXX.p8 file
# Existing worker-deploy secrets reused by the pre-archive readiness gate:
#   VPS_HOST, VPS_SSH_KEY — SSH to the live worker; no new release secret/API.

name: iOS TestFlight Upload

on:
  workflow_dispatch:
    inputs:
      expected_build:
        description: 'Exact committed CFBundleVersion to upload (this release: 111).'
        required: true
        default: '111'
      marketing_version:
        description: 'App version shown to testers (e.g. 1.1). Leave empty to keep the current project version.'
        required: false
        default: ''

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  TEAM_ID: 5D9FLR3MMA

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Enforce main-current committed build number
        env:
          EXPECTED_BUILD: ${{ inputs.expected_build }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "TestFlight is main-only; selected ref was $GITHUB_REF" >&2
            exit 1
          }
          git fetch origin main --quiet
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "Checked-out commit is not current origin/main" >&2
            exit 1
          }
          BUILDS=$(grep 'CURRENT_PROJECT_VERSION = ' ios/App/App.xcodeproj/project.pbxproj \
            | sed -E 's/.*= ([0-9]+);/\1/' | sort -u)
          test "$(printf '%s\n' "$BUILDS" | wc -l | tr -d ' ')" = "1" || {
            echo "Project contains inconsistent build numbers: $BUILDS" >&2
            exit 1
          }
          test "$BUILDS" = "$EXPECTED_BUILD" || {
            echo "Committed build is $BUILDS, requested upload is $EXPECTED_BUILD" >&2
            exit 1
          }
          test -z "$(git status --porcelain)" || {
            echo "Checkout is dirty before pipeline stamping" >&2
            exit 1
          }
          echo "Verified main commit $(git rev-parse --short=10 HEAD), build $BUILDS"

      - name: Select newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Install JS dependencies (Capacitor plugins)
        run: npm ci --ignore-scripts

      - name: Generate Prisma client for release tests
        run: npx prisma generate

      - name: Calling release tests and typecheck
        env:
          # tsc over this repo aborts (SIGABRT, heap) on the smaller macOS
          # runner with node's default old-space — build-89 run 30482784326.
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npx vitest run src/agent/lib/__tests__/office-call*.test.ts
          npx vitest run \
            src/agent/lib/__tests__/image-action-contract.test.ts \
            src/agent/protocol/__tests__/agent-event-image-card.test.ts \
            src/app/api/assistant/actions/__tests__/route.test.ts \
            'src/app/api/assistant/actions/[id]/approve/__tests__/image-approval-claim.test.ts' \
            'src/app/api/assistant/actions/[id]/retry/__tests__/route.test.ts' \
            src/app/api/assistant/conversations/__tests__/route-contract.test.ts \
            src/app/api/assistant/internal/__tests__/job-result-image-replay.test.ts \
            src/app/api/assistant/internal/__tests__/pending-jobs-dispatch.test.ts \
            src/app/api/assistant/internal/__tests__/pending-jobs-preview-scope.test.ts \
            src/lib/content-engine/__tests__/pipeline-render-idempotency.test.ts
          node --test \
            worker/src/__tests__/image-*.test.mjs \
            worker/src/__tests__/preview-image-e2e.test.mjs
          npm run type-check

      # CocoaPods fetches every podspec from a CDN that lives on
      # raw.githubusercontent.com, and GitHub rate-limits its own runners: on
      # 2026-08-17 four consecutive builds died on `429 Too Many Requests` for
      # AgoraRtcEngine / OneSignalXCFramework, before a line was ever compiled.
      # The cache makes a warm run skip the CDN entirely; the retry rides out a
      # cold one. Keyed on Podfile.lock so a dependency change re-resolves.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods/repos
            ios/App/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/App/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Sync Capacitor iOS project
        env:
          COCOAPODS_DISABLE_STATS: 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx cap sync ios; then exit 0; fi
            echo "cap sync failed (attempt $attempt) — CocoaPods CDN is rate-limiting" >&2
            # No backoff after the last attempt: three idle minutes of macOS
            # runtime that only delays the diagnostic.
            [ "$attempt" -lt 3 ] && sleep $((attempt * 60))
          done
          echo "cap sync failed three times; the CocoaPods CDN is refusing this runner" >&2
          exit 1

      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install

      - name: Keep the committed Podfile.lock (runner CocoaPods rewrites the lockfile)
        # The lockfile is committed from CocoaPods 1.12.1; the runner ships a
        # newer gem whose re-serialization dirties the file even when every pod
        # resolved exactly as locked (this failed the provenance guard on the
        # build-103 archives, runs 6-8, 2026-08-13). Two benign cross-version
        # rewrites are tolerated: the COCOAPODS version line, and SPEC CHECKSUMS
        # entries for the path-based Capacitor plugin pods — newer CocoaPods
        # serializes the podspec JSON differently, so the SHA1 flips even though
        # the podspec bytes (from `npm ci` against the committed package-lock)
        # are identical (run 8 proved the diff is exactly these lines). Real
        # dependency drift always changes PODS version lines, which still fail
        # the run with the diff printed. pod install with a lockfile present
        # installs the locked versions or errors, so restoring the committed
        # bytes afterwards is cosmetic.
        run: |
          if ! git diff --quiet -- ios/App/Podfile.lock; then
            git --no-pager diff -- ios/App/Podfile.lock
            if git diff -- ios/App/Podfile.lock \
              | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' \
              | grep -vqE '^[+-]COCOAPODS: [0-9][0-9.]*$|^[+-]  [A-Za-z][A-Za-z0-9_-]*: [0-9a-f]{40}$'; then
              echo "Podfile.lock changed beyond CocoaPods re-serialization (version or pod-list drift) — refusing to mask it" >&2
              exit 1
            fi
            # A checksum line is only benign as a rewrite of an existing entry:
            # the same pod names must appear on both sides of the diff.
            removed=$(git diff -- ios/App/Podfile.lock | grep -E '^-  [A-Za-z][A-Za-z0-9_-]*: [0-9a-f]{40}$' | cut -c2- | cut -d: -f1 | sort)
            added=$(git diff -- ios/App/Podfile.lock | grep -E '^\+  [A-Za-z][A-Za-z0-9_-]*: [0-9a-f]{40}$' | cut -c2- | cut -d: -f1 | sort)
            if [ "$removed" != "$added" ]; then
              echo "Podfile.lock SPEC CHECKSUMS entries were added or removed — pod-list drift, refusing to mask it" >&2
              exit 1
            fi
            git checkout -- ios/App/Podfile.lock
            # Xcode's "[CP] Check Pods Manifest.lock" phase diffs Podfile.lock
            # against Pods/Manifest.lock (pod install's own copy, still in the
            # runner gem's serialization — it failed run 10's archive). The
            # manifest is by definition a byte copy of the lockfile at install
            # time, so restoring one requires restoring the other; installed
            # pod content is untouched.
            cp ios/App/Podfile.lock ios/App/Pods/Manifest.lock
            echo "Restored committed Podfile.lock (only cross-version CocoaPods re-serialization differed)"
          fi

      - name: Stamp the built commit into Info.plist (forensics parity with the Mac path)
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :ALMAGitCommit ${GITHUB_SHA}" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :ALMAGitCommit string ${GITHUB_SHA}" "$PLIST"
          echo "ALMAGitCommit=${GITHUB_SHA}"

      - name: Production readiness gate (frontend, DB and live image worker)
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo "::error::VPS_SSH_KEY is required for release readiness"; exit 1; }
          test -n "$VPS_HOST" || { echo "::error::VPS_HOST is required for release readiness"; exit 1; }
          KEY_FILE="$RUNNER_TEMP/vps_release_readiness_key"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i "$KEY_FILE" -o BatchMode=yes -o ConnectTimeout=15 \
            "root@$VPS_HOST" bash -s -- "$GITHUB_SHA" <<'EOF'
          set -euo pipefail
          EXPECTED_SHA="$1"
          REPO=/opt/alma-erp
          WORKER="$REPO/worker"
          test "$(git -C "$REPO" rev-parse HEAD)" = "$EXPECTED_SHA" || {
            echo "Worker checkout is not the release commit" >&2
            exit 1
          }
          cd "$WORKER"
          test -f .env || { echo "Worker runtime env file is missing" >&2; exit 1; }
          DOTENV_CONFIG_PATH=.env node --require dotenv/config --input-type=module - "$EXPECTED_SHA" <<'NODE'
          import { createClient } from '@supabase/supabase-js'

          const expectedSha = process.argv[2]
          const required = [
            'APP_URL',
            'AGENT_INTERNAL_TOKEN',
            'SUPABASE_URL',
            'SUPABASE_SERVICE_ROLE_KEY',
          ]
          for (const key of required) {
            if (!String(process.env[key] ?? '').trim()) throw new Error(`${key} is missing on the live worker`)
          }

          const appUrl = String(process.env.APP_URL).replace(/\/$/, '')
          const frontendResponse = await fetch(`${appUrl}/api/health`, {
            headers: { 'cache-control': 'no-cache' },
            signal: AbortSignal.timeout(15_000),
          })
          if (!frontendResponse.ok) throw new Error(`frontend health HTTP ${frontendResponse.status}`)
          const frontend = await frontendResponse.json()
          if (frontend.ok !== true || frontend.database?.ok !== true) {
            throw new Error('production frontend/database health is not ready')
          }
          if (frontend.frontend?.git_commit !== expectedSha) {
            throw new Error(`production frontend SHA mismatch: ${frontend.frontend?.git_commit ?? 'missing'}`)
          }

          const diagnosticPort = Number(process.env.DIAGNOSTIC_HTTP_PORT || 3098)
          const workerResponse = await fetch(`http://127.0.0.1:${diagnosticPort}/health`, {
            headers: { authorization: `Bearer ${process.env.AGENT_INTERNAL_TOKEN}` },
            signal: AbortSignal.timeout(10_000),
          })
          if (!workerResponse.ok) throw new Error(`worker diagnostic HTTP ${workerResponse.status}`)
          const worker = await workerResponse.json()
          const bootCommit = String(worker.bootCommit ?? '')
          if (worker.ok !== true || bootCommit.length < 7 || !expectedSha.startsWith(bootCommit)) {
            throw new Error(`live worker commit mismatch: ${bootCommit || 'missing'}`)
          }

          const supabase = createClient(
            process.env.SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE_KEY,
            { auth: { persistSession: false, autoRefreshToken: false } },
          )
          const { data: capabilityRow, error: capabilityError } = await supabase
            .from('agent_kv_settings')
            .select('value')
            .eq('key', 'image_worker_capabilities_v1')
            .maybeSingle()
          if (capabilityError) throw capabilityError
          if (!capabilityRow?.value) throw new Error('live image worker capability receipt is missing')
          const capability = JSON.parse(capabilityRow.value)
          const capabilityAgeMs = Date.now() - Date.parse(String(capability.updatedAt ?? ''))
          if (
            capability.version !== 1
            || capability.source !== 'alma-agent-worker'
            || !Array.isArray(capability.models)
            || capability.models.length === 0
            || !Number.isFinite(capabilityAgeMs)
            || capabilityAgeMs < -60_000
            || capabilityAgeMs > 180_000
          ) {
            throw new Error('live image worker capability receipt is invalid or stale')
          }
          console.log(JSON.stringify({
            frontendCommit: expectedSha.slice(0, 10),
            database: 'healthy',
            workerCommit: bootCommit,
            workerCapabilityModels: capability.models,
            workerCapabilityAgeSeconds: Math.round(capabilityAgeMs / 1000),
          }))
          NODE
          EOF

      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive (Release, cloud signing)
        working-directory: ios/App
        env:
          MARKETING_VERSION_INPUT: ${{ inputs.marketing_version }}
        run: |
          EXTRA=""
          if [ -n "$MARKETING_VERSION_INPUT" ]; then
            EXTRA="MARKETING_VERSION=$MARKETING_VERSION_INPUT"
          fi
          # Do NOT pass CODE_SIGN_IDENTITY here: a command-line build setting hits
          # EVERY project in the workspace, so it forces the Pods targets to sign
          # with an identity the runner has no certificate for (run 29445470268:
          # "No signing certificate iOS Development found" × 13 pod targets). The
          # App project carries the right identity itself; automatic signing +
          # -allowProvisioningUpdates fetches what it needs, and -exportArchive
          # below distribution-signs in the cloud via the ASC key.
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            $EXTRA

      - name: Write export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Clean up API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
