# iOS Simulator build check — compile-verifies the native app WITHOUT signing.
# Never touches TestFlight / App Store Connect, so it cannot consume any
# TestFlight build quota. Safe to run as often as needed.
#
# Triggers (roadmap Phase 4.5): manual, plus pull_request ONLY when native
# assistant code / the protocol schema / turn plumbing changed — those are the
# regressions this gate exists to block. Path-scoped because macOS runners bill
# at 10x minutes; unrelated PRs never pay for a Mac runner.

name: iOS Simulator Build (no TestFlight)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - 'src/agent/protocol/**'
      - 'src/agent/lib/turn-status.ts'
      - 'src/agent/lib/turn-events.ts'
      - 'src/app/api/assistant/turn/**'
      - 'prisma/schema.prisma'
      # Presentation-parity roadmap (stage 5): the native client renders what these
      # produce — server presentation/timeline drift must also compile-check iOS.
      - 'src/agent/lib/presentation/**'
      - 'src/app/api/assistant/conversations/**'
      - 'src/agent/lib/models/run-owner-turn.ts'
      - 'src/agent/lib/core.ts'

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-simulator:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies (Capacitor plugins)
        # --ignore-scripts skips "prisma generate" etc. — not needed for the iOS shell
        run: npm ci --ignore-scripts

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install

      - name: Build for iOS Simulator (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO

      - name: Capture Office Robot Simulator preview
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          RUNTIME="$(
            xcrun simctl list runtimes --json |
              jq -r '
                [.runtimes[]
                  | select(.isAvailable == true and (.name | startswith("iOS")))]
                | sort_by(.version | split(".") | map(tonumber))
                | last.identifier
              '
          )"
          RUNTIME_VERSION="$(
            xcrun simctl list runtimes --json |
              jq -r '
                [.runtimes[]
                  | select(.isAvailable == true and (.name | startswith("iOS")))]
                | sort_by(.version | split(".") | map(tonumber))
                | last.version
              '
          )"
          test -n "$RUNTIME"
          test "${RUNTIME_VERSION%%.*}" -ge 17

          DEVICE_TYPE="$(
            xcrun simctl list devicetypes --json |
              jq -r '
                ([.devicetypes[] | select(.name == "iPhone 16 Pro")][0].identifier)
                // ([.devicetypes[] | select(.name | startswith("iPhone"))][-1].identifier)
              '
          )"
          test -n "$DEVICE_TYPE"

          UDID="$(xcrun simctl create "ALMA-PR-${GITHUB_RUN_ID}" "$DEVICE_TYPE" "$RUNTIME")"
          VIDEO_PID=""
          cleanup() {
            if [[ -n "$VIDEO_PID" ]]; then
              kill -INT "$VIDEO_PID" 2>/dev/null || true
              wait "$VIDEO_PID" 2>/dev/null || true
            fi
            xcrun simctl shutdown "$UDID" 2>/dev/null || true
            xcrun simctl delete "$UDID" 2>/dev/null || true
          }
          trap cleanup EXIT

          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

          APP_PATH="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl status_bar "$UDID" override \
            --time 9:41 \
            --batteryState charged \
            --batteryLevel 100 \
            --wifiBars 3 \
            --cellularBars 4

          PREVIEW_DIR="$RUNNER_TEMP/ios-preview"
          mkdir -p "$PREVIEW_DIR"
          xcrun simctl io "$UDID" recordVideo \
            --codec=h264 \
            --force \
            "$PREVIEW_DIR/office-robot.mp4" &
          VIDEO_PID=$!

          SIMCTL_CHILD_ALMA_NAV_SELFTEST=1 \
          SIMCTL_CHILD_ALMA_NAV_SELFTEST_ROUTES=/orders \
            xcrun simctl launch "$UDID" com.almatraders.erp

          sleep 7
          xcrun simctl io "$UDID" screenshot \
            "$PREVIEW_DIR/office-robot-dashboard.png"
          sleep 7
          xcrun simctl io "$UDID" screenshot \
            "$PREVIEW_DIR/office-robot-orders.png"
          sleep 3

          kill -INT "$VIDEO_PID"
          wait "$VIDEO_PID" || true
          VIDEO_PID=""

      - name: Upload Office Robot Simulator preview
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ios-office-robot-pr-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/ios-preview/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
