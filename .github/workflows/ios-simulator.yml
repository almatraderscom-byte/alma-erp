# iOS Simulator build check — compile-verifies the native app WITHOUT signing.
# Never touches TestFlight / App Store Connect, so it cannot consume any
# TestFlight build quota. Safe to run as often as needed.
#
# Triggers (roadmap Phase 4.5): manual, plus pull_request ONLY when native
# assistant code / the protocol schema / turn plumbing changed — those are the
# regressions this gate exists to block. Path-scoped because macOS runners bill
# at 10x minutes; unrelated PRs never pay for a Mac runner.

name: iOS Simulator Build (no TestFlight)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - 'src/agent/protocol/**'
      - 'src/agent/lib/turn-status.ts'
      - 'src/agent/lib/turn-events.ts'
      - 'src/app/api/assistant/turn/**'
      - 'prisma/schema.prisma'
      # Presentation-parity roadmap (stage 5): the native client renders what these
      # produce — server presentation/timeline drift must also compile-check iOS.
      - 'src/agent/lib/presentation/**'
      - 'src/app/api/assistant/conversations/**'
      - 'src/agent/lib/models/run-owner-turn.ts'
      - 'src/agent/lib/core.ts'

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-simulator:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies (Capacitor plugins)
        # --ignore-scripts skips "prisma generate" etc. — not needed for the iOS shell
        run: npm ci --ignore-scripts

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install

      - name: Install Simulator permission helper
        if: github.event_name == 'pull_request'
        run: |
          brew tap wix/brew
          brew install applesimutils
          applesimutils --version

      - name: Build for iOS Simulator (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO

      - name: Capture Office Robot Simulator preview
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          RUNTIME="$(
            xcrun simctl list runtimes --json |
              jq -r '
                [.runtimes[]
                  | select(.isAvailable == true and (.name | startswith("iOS")))]
                | sort_by(.version | split(".") | map(tonumber))
                | last.identifier
              '
          )"
          RUNTIME_VERSION="$(
            xcrun simctl list runtimes --json |
              jq -r '
                [.runtimes[]
                  | select(.isAvailable == true and (.name | startswith("iOS")))]
                | sort_by(.version | split(".") | map(tonumber))
                | last.version
              '
          )"
          test -n "$RUNTIME"
          test "${RUNTIME_VERSION%%.*}" -ge 17

          DEVICE_TYPE="$(
            xcrun simctl list devicetypes --json |
              jq -r '
                ([.devicetypes[] | select(.name == "iPhone 16 Pro")][0].identifier)
                // ([.devicetypes[] | select(.name | startswith("iPhone"))][-1].identifier)
              '
          )"
          test -n "$DEVICE_TYPE"

          UDID="$(xcrun simctl create "ALMA-PR-${GITHUB_RUN_ID}" "$DEVICE_TYPE" "$RUNTIME")"
          VIDEO_PID=""
          LOG_PID=""
          cleanup() {
            if [[ -n "$VIDEO_PID" ]]; then
              kill -INT "$VIDEO_PID" 2>/dev/null || true
              wait "$VIDEO_PID" 2>/dev/null || true
            fi
            if [[ -n "$LOG_PID" ]]; then
              kill -TERM "$LOG_PID" 2>/dev/null || true
              wait "$LOG_PID" 2>/dev/null || true
            fi
            xcrun simctl shutdown "$UDID" 2>/dev/null || true
            xcrun simctl delete "$UDID" 2>/dev/null || true
          }
          trap cleanup EXIT

          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

          APP_PATH="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH"
          test -s "$APP_PATH/PlugIns/AlmaWidgetExtension.appex/Assets.car"
          xcrun assetutil --info \
            "$APP_PATH/PlugIns/AlmaWidgetExtension.appex/Assets.car" \
            > "$RUNNER_TEMP/alma-widget-assets.json"
          grep -q "AlmaWidgetRobotStrip" "$RUNNER_TEMP/alma-widget-assets.json"
          xcrun simctl install "$UDID" "$APP_PATH"
          # A fresh Simulator otherwise presents OneSignal's notification sheet
          # over the whole demo. AppleSimulatorUtils handles this non-TCC
          # permission and restarts SpringBoard before the recording begins.
          applesimutils \
            --byId "$UDID" \
            --bundle com.almatraders.erp \
            --setPermissions "notifications=YES"
          # Notification permission changes restart Simulator SpringBoard.
          # Give both SpringBoard and Spotlight their documented helper window,
          # then re-confirm boot readiness before launching or recording.
          sleep 15
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override \
            --time 9:41 \
            --batteryState charged \
            --batteryLevel 100 \
            --wifiBars 3 \
            --cellularBars 4

          PREVIEW_DIR="$RUNNER_TEMP/ios-preview"
          mkdir -p "$PREVIEW_DIR"
          xcrun simctl spawn "$UDID" log stream \
            --level debug \
            --signpost \
            --style compact \
            --predicate 'subsystem == "com.almatraders.erp.perf"' \
            > "$PREVIEW_DIR/robot-selftest.log" 2>&1 &
          LOG_PID=$!

          xcrun simctl io "$UDID" recordVideo \
            --codec=h264 \
            --force \
            "$PREVIEW_DIR/office-robot.mp4" &
          VIDEO_PID=$!

          SIMCTL_CHILD_ALMA_ROBOT_SELFTEST=1 \
          SIMCTL_CHILD_ALMA_PULSE_DEMO=approval \
            xcrun simctl launch "$UDID" com.almatraders.erp

          # DEBUG-only in-app harness shows the long-press quick actions,
          # Office Chat, Walkie/Call, and directional running while dragged.
          APP_DATA="$(xcrun simctl get_app_container \
            "$UDID" com.almatraders.erp data)"
          TRACE="$APP_DATA/Library/Caches/alma-robot-selftest.txt"
          ROBOT_DEMO_FINISHED=0
          for _ in {1..60}; do
            if grep -Fxq "robotSelfTest.completed" "$TRACE" 2>/dev/null; then
              ROBOT_DEMO_FINISHED=1
              break
            fi
            sleep 1
          done
          if [[ "$ROBOT_DEMO_FINISHED" != "1" ]]; then
            echo "Robot Simulator demo did not complete within 60 seconds."
            test ! -f "$TRACE" || cat "$TRACE"
            exit 1
          fi

          xcrun simctl io "$UDID" screenshot \
            "$PREVIEW_DIR/office-robot-interactions.png"

          # Keep recording while ALMA moves to the background. A fresh Pulse
          # activity makes the compact Dynamic Island Robot visible in the same
          # unsigned Simulator preview.
          xcrun simctl launch "$UDID" com.apple.Preferences >/dev/null 2>&1 \
            || xcrun simctl launch "$UDID" com.apple.mobilesafari >/dev/null
          sleep 10

          xcrun simctl io "$UDID" screenshot \
            "$PREVIEW_DIR/office-robot-dynamic-island.png"

          kill -INT "$VIDEO_PID"
          wait "$VIDEO_PID" || true
          VIDEO_PID=""

          kill -TERM "$LOG_PID" 2>/dev/null || true
          wait "$LOG_PID" || true
          LOG_PID=""

          # Simulator's unified log can omit point signposts even after the app
          # completed the demo. Verify the DEBUG-only deterministic trace from
          # the app container and preserve both files for diagnosis.
          test -s "$TRACE"
          cp "$TRACE" "$PREVIEW_DIR/robot-selftest-trace.txt"
          grep -Fxq "robotSelfTest.longPress" "$TRACE"
          grep -Fxq "robotSelfTest.tapChat" "$TRACE"
          grep -Fxq "robotSelfTest.openCall" "$TRACE"
          grep -Fxq "robotSelfTest.dragDone" "$TRACE"
          grep -Fxq "robotSelfTest.completed" "$TRACE"
          grep -Fxq "robotSelfTest.dynamicIslandStarted" "$TRACE"

      - name: Upload Office Robot Simulator preview
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ios-office-robot-pr-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/ios-preview/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
